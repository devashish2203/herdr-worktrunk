id = "worktrunk"
name = "Worktrunk"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Switch, create, remove, or merge git worktrees via worktrunk"
platforms = ["macos", "linux", "windows"]
# Workspace actions: open.sh / open.ps1 resolves the workspace's repo and the
# configured picker placement, then opens the entrypoint named here.
#
# Windows support uses item-level platform overrides: each action and pane is
# declared twice, once for macos/linux (bash) and once for windows (Windows
# PowerShell). Ids must be unique, so the Windows twins carry a "-windows"
# suffix, and the Windows actions open the "-windows" pane entrypoints. Pane
# commands use $env:HERDR_PLUGIN_ROOT because herdr opens plugin panes with the
# workspace repo as cwd, not the plugin root. Panes omit -NonInteractive: the
# fzf picker and worktrunk's own confirmation prompts need the console.
[[actions]]
id = "open"
title = "Worktree: switch / create from default branch"
contexts = ["workspace"]
platforms = ["macos", "linux"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/open.sh\" picker-default"]

[[actions]]
id = "open-windows"
title = "Worktree: switch / create from default branch"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/open.ps1\" picker-default-windows"]

[[actions]]
id = "open-current"
title = "Worktree: switch / create from current branch"
contexts = ["workspace"]
platforms = ["macos", "linux"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/open.sh\" picker-current"]

[[actions]]
id = "open-current-windows"
title = "Worktree: switch / create from current branch"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/open.ps1\" picker-current-windows"]

[[actions]]
id = "open-with-remotes"
title = "Worktree: switch / create from local or remote branches"
contexts = ["workspace"]
platforms = ["macos", "linux"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/open.sh\" picker-with-remotes"]

[[actions]]
id = "open-with-remotes-windows"
title = "Worktree: switch / create from local or remote branches"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/open.ps1\" picker-with-remotes-windows"]

[[actions]]
id = "remove"
title = "Worktree: remove"
contexts = ["workspace"]
platforms = ["macos", "linux"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/open.sh\" remover"]

[[actions]]
id = "remove-windows"
title = "Worktree: remove"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/open.ps1\" remover-windows"]

[[actions]]
id = "merge"
title = "Worktree: merge into the target branch"
contexts = ["workspace"]
platforms = ["macos", "linux"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/open.sh\" merger"]

[[actions]]
id = "merge-windows"
title = "Worktree: merge into the target branch"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/open.ps1\" merger-windows"]

[[actions]]
id = "merge-no-squash"
title = "Worktree: merge into the target branch, keeping every commit"
contexts = ["workspace"]
platforms = ["macos", "linux"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/open.sh\" merger-no-squash"]

[[actions]]
id = "merge-no-squash-windows"
title = "Worktree: merge into the target branch, keeping every commit"
contexts = ["workspace"]
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-NonInteractive", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/open.ps1\" merger-no-squash-windows"]

# Both panes run as plain bash (or Windows PowerShell). Depending on plugin
# config, picker.sh / picker.ps1 opens the checkout in a tab or registers it as
# a native herdr worktree workspace.
[[panes]]
id = "picker-default"
title = "Worktrunk — default branch"
placement = "split"
platforms = ["macos", "linux"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/picker.sh\" --create-base=default"]

[[panes]]
id = "picker-default-windows"
title = "Worktrunk — default branch"
placement = "split"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/picker.ps1\" --create-base=default"]

[[panes]]
id = "picker-current"
title = "Worktrunk — current branch"
placement = "split"
platforms = ["macos", "linux"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/picker.sh\" --create-base=current"]

[[panes]]
id = "picker-current-windows"
title = "Worktrunk — current branch"
placement = "split"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/picker.ps1\" --create-base=current"]

[[panes]]
id = "picker-with-remotes"
title = "Worktrunk — local and remote branches"
placement = "split"
platforms = ["macos", "linux"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/picker.sh\" --show-with-remotes"]

[[panes]]
id = "picker-with-remotes-windows"
title = "Worktrunk — local and remote branches"
placement = "split"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/picker.ps1\" --show-with-remotes"]

[[panes]]
id = "remover"
title = "Worktrunk — remove"
placement = "split"
platforms = ["macos", "linux"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/remove.sh\""]

[[panes]]
id = "remover-windows"
title = "Worktrunk — remove"
placement = "split"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/remove.ps1\""]

[[panes]]
id = "merger"
title = "Worktrunk — merge"
placement = "split"
platforms = ["macos", "linux"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/merge.sh\""]

[[panes]]
id = "merger-windows"
title = "Worktrunk — merge"
placement = "split"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/merge.ps1\""]

[[panes]]
id = "merger-no-squash"
title = "Worktrunk — merge (no squash)"
placement = "split"
platforms = ["macos", "linux"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/merge.sh\" --no-squash"]

[[panes]]
id = "merger-no-squash-windows"
title = "Worktrunk — merge (no squash)"
placement = "split"
platforms = ["windows"]
command = ["powershell", "-NoProfile", "-ExecutionPolicy", "Bypass", "-Command", "& \"$env:HERDR_PLUGIN_ROOT/merge.ps1\" --no-squash"]
